[package]
name = "claude-commander-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for managing Claude coding sessions via tmux and git worktrees"
keywords = ["claude", "ai", "terminal", "tui", "tmux"]
categories = ["command-line-utilities", "development-tools"]

# Only the `claude-commander` bin crate drives the release (single shared tag).
# Without this, cargo-release would try to create the same `vX.Y.Z` tag once per
# member and the second attempt fails.
[package.metadata.release]
release = false

[lib]
name = "claude_commander_core"
path = "src/lib.rs"

[dependencies]
# Shared wire types (DTOs + WS protocol) — also consumed by the server and the
# mobile/desktop clients, so the serde shape has a single source of truth.
claude-commander-protocol = { path = "../claude-commander-protocol" }
# Session matching/ranking. Lives in `claude-commander-viewmodel` rather than here
# so the Flutter client's cdylib can share it — core is host-bound and the cdylib
# cannot depend on it, which is how the Dart scorer came to diverge.
claude-commander-viewmodel = { path = "../claude-commander-viewmodel" }

# Async runtime
tokio = { workspace = true }
futures = "0.3"
notify = "8.2"

# No clap: defining a CLI is a binary's job, so the clap tree and the CLI
# reference generated from it live in `claude-commander` (and the server's own
# `main.rs`). Embedders of this library don't inherit an argument parser.

# `Color` for the `[theme]` config values and the tmux `status-style` string.
# ratatui 0.30 is the modularised release and re-exports `ratatui_core::style`
# verbatim (`pub use ratatui_core::{style, symbols, text};`), so this is the
# SAME `Color` type the TUI renders with — not a mirror — and the hand-written
# `ColorValue` serde impl in `config/theme.rs` is unaffected by using it here.
# Depending on ratatui-core rather than full ratatui is what lets the headless
# server and the mobile cdylib skip the whole terminal-UI dependency tree.
#
# `features = ["std"]` is REQUIRED, not decorative: ratatui-core's default
# feature set is empty (`default = []`), and it is full ratatui that normally
# turns `std` on. A consumer that takes core without the TUI crate (the server,
# claude-commander-remote, client/rust) would otherwise get a no_std build.
#
# Keep this version in lockstep with the TUI crate's `ratatui`: if a future
# ratatui bumps to ratatui-core 0.2 while this stays 0.1, `Color` becomes two
# distinct types and `config/theme.rs` stops type-checking against the TUI.
# That is a loud compile error, not silent breakage, but bump both together.
ratatui-core = { version = "0.1", features = ["std"] }

# Key events. NOT a rendering dependency: `config/keybindings.rs` persists
# crossterm `KeyCode`/`KeyModifiers` in the keybinding map, and `tmux/attach.rs`
# toggles raw mode, so these stay here after the frontend moved out. Crossterm is
# pure Rust with no native libraries. The `event-stream` feature is enabled
# nowhere in the workspace: the TUI reads the terminal with the synchronous
# `poll`/`read` pair on a thread it owns (`claude-commander-tui/src/event.rs`).
crossterm = "0.29"

# Diff view-model and layout engine: unified-diff parsing, logical rows,
# gap expansion, role-tagged spans, soft wrapping and hit-testing. The review
# view and `git::review_diff`'s parser both delegate to it.
#
# Pinned to an exact revision rather than a branch so a build is reproducible
# and an upstream push can't silently change what this compiles against. Bump
# the `rev` deliberately when picking up diffgrid changes — and bump it in
# `claude-commander-tui` and `client/rust` in the same commit. `Config.theme`
# embeds a `diffgrid::style::Appearance`, so a rev that differs between core and
# a frontend makes that two distinct types and the frontend stops compiling
# against core (see #270, which fixed exactly that for the cdylib).
diffgrid = { git = "https://github.com/sizeak/diffgrid", rev = "83698a53458868c7c691d89dbb21e89fbc905afa" }

# Git (pure Rust)
gix = { version = "0.85", default-features = false, features = [
    "sha1",
    "worktree-mutation",
    "revision",
    "status",
    "dirwalk",
    "index",
] }

# Configuration (layered: env -> file -> CLI)
figment = { version = "0.10", features = ["toml", "env"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
toml_edit = "0.25"

# Error handling. No color-eyre: installing a panic/error reporter is a binary's
# job, and `claude-commander` already owns that dependency.
thiserror = { workspace = true }
anyhow = "1.0"

# Observability. Emitting spans/events is the library's job; *subscribing* to
# them is the binary's, so tracing-subscriber is not a dependency here.
tracing = { workspace = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
directories = "6.0"
# URL parsing for validating configured remote-server base URLs at load time,
# so a malformed `[[remote_servers]]` url is rejected with a clear error rather
# than surfacing only when the backend is constructed.
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex = "1.12"
# No unicode-width / unicode-segmentation: the width and grapheme arithmetic they
# serve is the review view's, so they live with `claude-commander-tui`. Core's own
# diff work delegates to `diffgrid`.

# Async utilities
async-trait = "0.1"

# PTY for terminal attachment
pty-process = { version = "0.5", features = ["async"] }

# Unix system calls (safe wrappers). `signal` is what lets `git::clone` kill a
# timed-out clone's whole process group rather than just the process it spawned.
nix = { version = "0.31", features = ["term", "poll", "fs", "user", "signal"] }


# RGBA→PNG encoding for pasted screenshots (`paste_image.rs`). The *rendering*
# of those images is the frontend's job and lives with ratatui-image there;
# encoding and the pruned temp-file store are core's.
image = "0.25"

# Conversation mode (TTS + STT): HTTP client for the OpenAI-compatible TTS/STT
# endpoints (rustls to avoid an OpenSSL C dependency, consistent with the
# pure-Rust lean; `multipart` for the STT audio upload).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "rustls",
] }
# In-process audio playback (rodio) and microphone capture (cpal), gated behind
# the `audio` feature. cpal's `pipewire` feature selects PipeWire as the default
# host at runtime (falling back to ALSA if PipeWire isn't running), so on Linux
# these builds link both libpipewire and ALSA. Only builds that actually do
# device I/O (the TUI binary) pull them — the headless server and the Flutter
# client's cdylib build with `audio` off and never link either. `hound` encodes
# captured PCM to WAV for upload.
#
# rodio is pinned to a git rev rather than the 0.22.x release: the last release
# still depends on cpal 0.17, which has no PipeWire host, so a released rodio +
# our cpal 0.18 would resolve to *two* cpal versions and leave playback on ALSA.
# rodio master moved to cpal 0.18 and forwards `pipewire = ["cpal/pipewire"]`, so
# both playback (rodio) and capture (our direct cpal) unify onto a single
# PipeWire-backed cpal 0.18. Bump this rev when a rodio release ships cpal 0.18.
# The `tracing` feature is essential, not cosmetic: without it rodio's internal
# messages (the cpal stream-error callback that fires when the default output
# device changes, and the device-sink drop notice) fall back to `eprintln!`
# straight to stderr. In the TUI those land on the terminal and corrupt the
# display — the `tracing` feature reroutes them through the subscriber, which the
# TUI sends to the log file. Don't drop it.
rodio = { git = "https://github.com/RustAudio/rodio", rev = "ee3c21f2f3d926110706a2780658d098831c1ed9", default-features = false, features = [
    "playback",
    "pipewire",
    "tracing",
    "wav",
    "mp3",
], optional = true }
cpal = { version = "0.18", optional = true, features = ["pipewire"] }
hound = { version = "3.5", optional = true }
# Local OS-clipboard access, gated behind the `clipboard` feature. arboard links
# X11/Wayland (xcb) on Linux, so — like `audio` — only the desktop TUI needs it;
# the server, remote backend, test-support and client cdylib take core with
# `default-features = false` to drop it.
arboard = { version = "3.6", optional = true }

[features]
# On by default so `cargo build`, the TUI binary, and `cargo test` all get voice
# device I/O and local clipboard access. Downstream crates that never touch a
# mic/speaker or clipboard (the server, test-support, the client cdylib) depend
# on core with `default-features = false` to drop the ALSA-linked
# rodio/cpal/hound and the X11/Wayland-linked arboard entirely.
default = ["audio", "clipboard"]
audio = ["dep:rodio", "dep:cpal", "dep:hound"]
clipboard = ["dep:arboard"]
# Exposes test scaffolding (`backend::mock::MockBackend`,
# `api::snapshot_from_state`) to OTHER crates' tests. A `#[cfg(test)]`
# item is invisible across a crate boundary, and `claude-commander-tui`'s tests
# need both — so they are gated on `any(test, feature = "test-support")` instead.
# Enable it only from a `[dev-dependencies]` entry: it is off by default, so
# `cargo build` never compiles the double into a release binary, the headless
# server, or the mobile cdylib.
test-support = []

[dev-dependencies]
# Itself, with `test-support`: `tests/` is a separate crate, so `cfg(test)` does
# not reach core from there, and its fixtures need `git::fixture` (git that never
# signs, whatever the developer's global config says).
claude-commander-core = { path = ".", default-features = false, features = ["test-support"] }
# Property-based testing
proptest = "1.11"
# Async test utilities
tokio-test = "0.4"
# Temp directories for integration tests
tempfile = "3.27"
# Test assertions
pretty_assertions = "1.4"
# Set file mtimes deterministically (paste-image prune test)
filetime = "0.2"
