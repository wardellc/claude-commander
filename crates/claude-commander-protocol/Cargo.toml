[package]
name = "claude-commander-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wire types (DTOs + WebSocket control protocol) for the Claude Commander server API and its clients"

# Only the `claude-commander` bin crate drives the release (single shared tag).
[package.metadata.release]
release = false

[lib]
name = "claude_commander_protocol"
path = "src/lib.rs"

[dependencies]
# Serialization — the whole point of this crate is the serde wire shape.
serde = { workspace = true }
serde_json = { workspace = true }
# Wire types carry ids and timestamps. Versions match `claude-commander-core`
# so the workspace resolves a single copy. Both cross-compile to mobile.
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# TypeScript bindings for the browser page (`web/src/generated/`), written by the
# `ts` feature's drift test. Optional and off by default: nothing in the normal
# build graph — in particular not the Android cross-build that reaches this crate
# through `client/rust` — compiles ts-rs.
ts-rs = { version = "12", optional = true, default-features = false, features = [
    "serde-compat",
    "uuid-impl",
    "chrono-impl",
] }

[features]
# `cargo test -p claude-commander-protocol --features ts` checks the committed
# bindings against a fresh export; see `src/ts_export.rs`.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3.27"
